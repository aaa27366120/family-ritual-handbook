<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#7a1f1f">
  <title>節日祭祀備忘手冊</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237a1f1f'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f1d98f' font-family='serif'%3E祀%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">節日祭祀備忘手冊</a>
  </header>

  <main id="app" class="wrap" aria-live="polite">
    <p class="loading">載入中…</p>
  </main>

  <noscript><p class="wrap">這個網頁需要開啟 JavaScript 才能顯示。</p></noscript>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-label="名詞解釋">
      <div id="sheetBody"></div>
      <button type="button" class="btn" data-act="close-sheet">知道了</button>
    </div>
  </div>

  <nav class="fontbar" aria-label="字體大小">
    <button type="button" class="fbtn" data-act="fs-down" aria-label="縮小字體">A－</button>
    <label class="frange">
      <span class="sr">字體大小</span>
      <input id="fsRange" type="range" min="18" max="48" step="2" value="24">
    </label>
    <button type="button" class="fbtn" data-act="fs-up" aria-label="放大字體">A＋</button>
    <span class="flabel" aria-hidden="true">字級 <b id="fsLabel">24</b></span>
  </nav>

  <script src="js/lunar.js"></script>
  <script src="js/viewmodel.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
